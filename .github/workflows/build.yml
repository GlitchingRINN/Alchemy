name: Build APK
on: workflow_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.32.2
          channel: stable

      - name: Create .env with empty values
        run: |
          cat > lib/.env << 'EOF'
          deezerGatewayAPI = '';
          deezerMobileKey = '';
          lastFmApiKey = '';
          lastFmApiSecret = '';
          acrcloudHost = '';
          acrcloudSongApiKey = '';
          acrcloudSongApiSecret = '';
          acrcloudHumsApiKey = '';
          acrcloudHumsApiSecret = '';
          EOF

      - name: Create signing key
        run: |
          keytool -genkey -v -keystore android/app/keys.jks -keyalg RSA -keysize 2048 -validity 10000 -alias mykey -storepass buildpass123 -keypass buildpass123 -dname "CN=Alchemy"
          cat > android/key.properties << 'EOF'
          storePassword=buildpass123
          keyPassword=buildpass123
          keyAlias=mykey
          storeFile=keys.jks
          EOF

      - name: Clone custom packages
        run: |
          git clone --depth 1 https://github.com/DJDoubleD/custom_navigator custom_navigator
          git clone --depth 1 https://github.com/DJDoubleD/external_path external_path
          git clone --depth 1 https://github.com/DJDoubleD/marquee marquee
          git clone --depth 1 https://github.com/DJDoubleD/move_to_background move_to_background
          git clone --depth 1 https://github.com/DJDoubleD/Scrobblenaut scrobblenaut
          ln -s scrobblenaut Scrobblenaut
          git clone --depth 1 https://github.com/SedlarDavid/figma_squircle figma_squircle
          git clone --depth 1 https://github.com/mufassalhussain/open_filex open_filex
          git clone --depth 1 https://github.com/PetitPrinc3/liquid_progress_indicator_v2 liquid_progress_indicator_v2
          for d in custom_navigator external_path marquee move_to_background scrobblenaut figma_squircle open_filex liquid_progress_indicator_v2; do
            (cd "$d" && flutter pub get && dart run build_runner build --delete-conflicting-outputs) || true
          done

      - run: flutter pub get
      - run: dart run build_runner build --delete-conflicting-outputs
      - run: flutter build apk --split-per-abi --release

      - uses: actions/upload-artifact@v4
        with:
          name: alchemy-apks
          path: build/app/outputs/flutter-apk/*.apk
